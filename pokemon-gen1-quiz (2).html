<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포켓몬 1세대 151마리 맞추기</title>
<style>
  :root{
    --bg: #101a12;
    --card-bg: #16261a;
    --card-locked: #1b2c1f;
    --accent: #ffcb05;
    --accent2: #3c5aa6;
    --text: #f2f6ef;
    --muted: #86a08c;
    --danger: #ee4b4b;
    --success: #4fd07a;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    background: radial-gradient(circle at 15% 0%, #1d3325, var(--bg) 65%);
    font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    color: var(--text);
    padding: 30px 14px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  h1{
    font-size: 21px;
    margin: 0 0 18px;
    letter-spacing: -0.4px;
    text-align:center;
  }
  .panel{
    display:flex;
    gap:10px;
    align-items:center;
    background: var(--card-bg);
    padding: 12px 16px;
    border-radius: 14px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content:center;
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
    width: 100%;
    max-width: 1700px;
  }
  input{
    background: #0c1610;
    border: 1px solid #2c4531;
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 15px;
    width: 200px;
    outline:none;
  }
  input:focus{ border-color: var(--accent); }
  button{
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-answer{ background: var(--accent); color:#332600; }
  .btn-give-up{ background: var(--danger); color:#fff; }
  .stat{
    font-size: 13px;
    color: var(--muted);
    display:flex;
    gap: 14px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(17, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 1700px;
  }
  .card{
    position:relative;
    aspect-ratio: 3/4;
    border-radius: 10px;
    background: var(--card-locked);
    border: 2px solid #29402e;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding: 4px 2px;
    transition: transform .18s ease;
  }
  .card.solved{
    animation: pop .35s ease;
  }
  @keyframes pop{
    0%{ transform: scale(.85); }
    60%{ transform: scale(1.06); }
    100%{ transform: scale(1); }
  }
  .num{
    position:absolute;
    top:3px;
    left:5px;
    font-size: 9px;
    color: var(--muted);
    font-weight:700;
  }
  .mark{
    font-size: 22px;
    color: #3d5645;
  }
  .avatar{
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size: 13px;
    color:#101a12;
    margin-top: 6px;
  }
  .name{
    font-size: 10.5px;
    margin-top: 4px;
    color: var(--text);
    text-align:center;
    font-weight:600;
    padding: 0 2px;
  }
  .types{
    display:flex;
    gap:3px;
    margin-top: 3px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .type-badge{
    font-size: 8px;
    padding: 1px 5px;
    border-radius: 20px;
    color:#0b0f0c;
    font-weight:700;
  }
  .toast{
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    background: #131f16;
    border: 1px solid #2c4531;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    pointer-events:none;
    transition: opacity .25s ease;
    max-width: 90vw;
    text-align:center;
  }
  .toast.show{ opacity: 1; }
  .toast.err{ border-color: var(--danger); color: #ffb9b9; }
  .note{
    margin-top: 24px;
    max-width: 640px;
    font-size: 12px;
    line-height:1.6;
    color: var(--muted);
    text-align:center;
  }
</style>
</head>
<body>

<h1>🔴 포켓몬 1세대 151마리 이름 맞추기</h1>

<div class="panel">
  <input id="guessInput" placeholder="포켓몬 이름 입력..." autocomplete="off">
  <button class="btn-answer" onclick="submitGuess()">정답</button>
  <button class="btn-give-up" onclick="giveUp()">포기</button>
  <div class="stat">
    <span id="timer">⏱ 00:00</span>
    <span id="score">정답 0 / 151</span>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="toast" id="toast"></div>

<p class="note">
  정답을 맞추면 번호 아래에 이름과 타입이 표시됩니다. 이상해씨~뮤까지 전부 도전해보세요!

let seconds = 0;
let timerHandle = null;

// ===== 효과음 (Web Audio API로 직접 합성 - 파일 불필요) =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, duration, type="sine", startDelay=0, volume=0.15){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = volume;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const startTime = audioCtx.currentTime + startDelay;
  gain.gain.setValueAtTime(volume, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

function playCorrectSound(){
  // 상승하는 2음 (도-미 느낌)
  playTone(659, 0.12, "triangle", 0);
  playTone(988, 0.18, "triangle", 0.1);
}

function playWrongSound(){
  // 낮고 짧은 buzz
  playTone(160, 0.18, "sawtooth", 0, 0.1);
}

function playCompleteSound(){
  // 승리 팡파레: 4음 상승
  [523, 659, 784, 1047].forEach((freq, i) => {
    playTone(freq, 0.22, "triangle", i * 0.13, 0.18);
  });
}
// ================================================

function normalize(str){
  return str.trim().toLowerCase().replace(/\s+/g,"");
}

function buildGrid(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  pokemons.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    card.id = "card-" + p.id;
    card.innerHTML = `
      <span class="num">#${String(p.id).padStart(3,"0")}</span>
      <span class="mark">?</span>
    `;
    grid.appendChild(card);
  });
}

function revealCard(p){
  const card = document.getElementById("card-" + p.id);
  card.classList.add("solved");
  const primaryColor = TYPE_COLOR[p.types[0]] || "#888";
  const typeBadges = p.types.map(t =>
    `<span class="type-badge" style="background:${TYPE_COLOR[t]}">${t}</span>`
  ).join("");
  card.innerHTML = `
    <span class="num">#${String(p.id).padStart(3,"0")}</span>
    <div class="avatar" style="background:${primaryColor}">${p.name[0]}</div>
    <div class="name">${p.name}</div>
    <div class="types">${typeBadges}</div>
  `;
}

function showToast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  setTimeout(()=> t.classList.remove("show"), 1200);
}

function updateScore(){
  document.getElementById("score").textContent = `정답 ${solved.size} / ${pokemons.length}`;
}

function submitGuess(){
  const input = document.getElementById("guessInput");
  const raw = input.value;
  if(!raw) return;
  const query = normalize(raw);

  const match = pokemons.find(p => {
    if (solved.has(p.id)) return false;
    const candidates = [p.name, ...p.aliases].map(normalize);
    return candidates.includes(query);
  });

  if(match){
    solved.add(match.id);
    revealCard(match);
    updateScore();
    showToast(`정답! ${match.name} (#${String(match.id).padStart(3,"0")})`, false);
    if(solved.size === pokemons.length){
      clearInterval(timerHandle);
      playCompleteSound();
      showToast("🎉 151마리 전부 맞췄어요!", false);
    } else {
      playCorrectSound();
    }
  } else {
    playWrongSound();
    showToast("틀렸어요 (또는 이미 맞춘 포켓몬)", true);
  }
  input.value = "";
  input.focus();
}

function giveUp(){
  pokemons.forEach(p => {
    if(!solved.has(p.id)){
      solved.add(p.id);
      revealCard(p);
    }
  });
  updateScore();
  clearInterval(timerHandle);
  showToast("포기! 전체 공개됨", true);
}

function tick(){
  seconds++;
  const m = String(Math.floor(seconds/60)).padStart(2,"0");
  const s = String(seconds%60).padStart(2,"0");
  document.getElementById("timer").textContent = `⏱ ${m}:${s}`;
}

document.getElementById("guessInput").addEventListener("keydown", e => {
  if(e.key === "Enter") submitGuess();
});

buildGrid();
updateScore();
timerHandle = setInterval(tick, 1000);
</script>
